name: Keep Supabase Awake

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl --fail \
            --request GET \
            --url "${{ secrets.SUPABASE_URL }}/rest/v1/emissions?select=id&limit=1" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"